<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おまんぼガチャ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Sans JP', sans-serif;
  overflow: hidden;
  background: #0a0008;
}
.bg-layer { position:fixed; inset:0; pointer-events:none; }
.bg-base {
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%, #3a0010 0%, transparent 55%),
    radial-gradient(ellipse 80% 50% at 0% 50%, #1a0030 0%, transparent 50%),
    radial-gradient(ellipse 80% 50% at 100% 50%, #001a30 0%, transparent 50%),
    radial-gradient(ellipse 100% 60% at 50% 110%, #200040 0%, transparent 55%),
    linear-gradient(160deg, #0f0008 0%, #08000f 40%, #000810 70%, #080005 100%);
  z-index:0;
}
.bg-lines {
  background-image: repeating-linear-gradient(105deg, transparent 0px, transparent 60px, rgba(255,180,0,0.03) 60px, rgba(255,180,0,0.03) 61px);
  z-index:1; animation: lineShimmer 8s linear infinite;
}
@keyframes lineShimmer { 0%{background-position:0 0} 100%{background-position:200px 200px} }
.bg-neon {
  background:
    radial-gradient(ellipse 300px 200px at 0% 0%, rgba(255,0,100,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 300px 200px at 100% 0%, rgba(0,200,255,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 300px 200px at 0% 100%, rgba(200,0,255,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 300px 200px at 100% 100%, rgba(255,150,0,0.08) 0%, transparent 70%);
  z-index:2; animation: neonPulse 3s ease-in-out infinite alternate;
}
@keyframes neonPulse { 0%{opacity:0.6} 100%{opacity:1.0} }
.bg-dots {
  background-image: radial-gradient(circle, rgba(255,200,100,0.35) 1px, transparent 1px);
  background-size: 32px 32px;
  z-index:3; animation: dotFade 4s ease-in-out infinite alternate;
}
@keyframes dotFade { 0%{opacity:0.4} 100%{opacity:0.8} }

.marquee-strip { position:fixed; left:0; right:0; height:20px; display:flex; align-items:center; justify-content:space-around; padding:0 4px; pointer-events:none; z-index:50; }
.marquee-strip.top { top:0; }
.marquee-strip.bottom { bottom:0; }
.bulb { width:13px; height:13px; border-radius:50%; flex-shrink:0; }
@keyframes bulbBlink { 0%{opacity:1;transform:scale(1)} 100%{opacity:0.2;transform:scale(0.7)} }

/* ===== POINT BAR ===== */
#point-bar {
  position: relative; z-index: 10;
  display: flex; align-items: center; gap: 10px;
  background: rgba(0,0,0,0.45);
  border: 1.5px solid rgba(255,180,0,0.45);
  border-radius: 30px;
  padding: 7px 18px;
  margin-bottom: 10px;
  box-shadow: 0 0 14px rgba(255,150,0,0.25);
}
#point-bar .pt-label { font-size:0.75rem; color:#ffaa44; font-weight:700; letter-spacing:0.1em; }
#point-display {
  font-size: 1.4rem; font-weight: 900; color: #ffe566;
  text-shadow: 0 0 10px rgba(255,200,0,0.8);
  min-width: 48px; text-align: right;
}
#point-bar .pt-unit { font-size:0.8rem; color:#ffaa44; font-weight:700; }
#exchange-btn {
  background: linear-gradient(135deg, #cc6600, #ff3388);
  color: #fff; border: none; border-radius: 20px;
  padding: 5px 14px; font-size: 0.75rem; font-weight: 900;
  font-family: 'Noto Sans JP', sans-serif;
  cursor: pointer; letter-spacing: 0.05em;
  box-shadow: 0 0 10px rgba(255,80,0,0.5);
  transition: transform 0.1s;
}
#exchange-btn:hover { transform: scale(1.06); }
#exchange-btn:active { transform: scale(0.95); }

/* ===== REMAINING COUNTER ===== */
#remaining-bar {
  position: relative; z-index: 10;
  font-size: 0.78rem; color: #cc88aa;
  margin-bottom: 6px; letter-spacing: 0.08em;
}
#remaining-bar span { color: #ffe566; font-weight: 900; font-size: 1rem; }

h1 {
  font-size: 2.1rem; font-weight: 900; letter-spacing: 0.08em;
  margin-bottom: 4px; text-align: center; position: relative; z-index: 10;
  background: linear-gradient(90deg, #ffe566 0%, #ffaa00 25%, #ff6600 50%, #ff00aa 75%, #cc44ff 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 0 14px rgba(255,180,0,0.9)) drop-shadow(0 0 28px rgba(255,80,0,0.5));
  animation: titleGlow 2s ease-in-out infinite alternate;
}
@keyframes titleGlow {
  0%   { filter: drop-shadow(0 0 10px rgba(255,180,0,0.7)) drop-shadow(0 0 24px rgba(255,60,0,0.4)); }
  100% { filter: drop-shadow(0 0 20px rgba(255,220,0,1.0)) drop-shadow(0 0 40px rgba(255,100,0,0.7)); }
}
.subtitle { font-size:0.85rem; color:#ffcc44; margin-bottom:16px; letter-spacing:0.1em; position:relative; z-index:10; text-shadow:0 0 8px rgba(255,200,0,0.6); }

.face-wrapper { position:relative; width:320px; height:320px; user-select:none; z-index:10; filter:drop-shadow(0 0 22px rgba(255,160,0,0.55)) drop-shadow(0 0 50px rgba(200,50,0,0.25)); }
.face-img { width:320px; height:320px; display:block; pointer-events:none; }

.eye-hitarea { position:absolute; width:110px; height:87px; top:138px; left:188px; border-radius:35%; cursor:pointer; }
.eye-spin { position:absolute; width:94px; height:71px; top:146px; left:196px; pointer-events:none; display:flex; align-items:center; justify-content:center; }
.eye-spin img { width:94px; height:71px; display:block; transform-origin:center center; }
.eye-spin.spinning img { animation: spinEye 2.5s cubic-bezier(0.3,0,0.25,1) forwards; }
@keyframes spinEye {
  0%   { transform:rotate(0deg)   scale(1);    }
  35%  { transform:rotate(420deg) scale(1.25); }
  65%  { transform:rotate(660deg) scale(1.1);  }
  85%  { transform:rotate(710deg) scale(0.95); }
  100% { transform:rotate(720deg) scale(1);    }
}
.hint { position:absolute; top:218px; left:226px; font-size:1.35rem; color:#ffcc44; font-weight:900; white-space:nowrap; text-shadow:0 0 10px rgba(255,200,0,0.9); animation:hintPulse 1.3s ease-in-out infinite; pointer-events:none; }
.hint.hidden { display:none; }
@keyframes hintPulse { 0%,100%{opacity:1;transform:translateX(0)} 50%{opacity:0.4;transform:translateX(-4px)} }

#capsule-container { position:absolute; left:131px; top:258px; pointer-events:none; }
.capsule { width:60px; height:80px; opacity:0; transform:scale(0); }
.capsule.launch { animation:launchCapsule 2.8s cubic-bezier(0.15,1.2,0.4,1) forwards; }
@keyframes launchCapsule {
  0%  { opacity:0; transform:scale(0.1) translateY(10px)   rotate(0deg);   }
  12% { opacity:1; transform:scale(0.6) translateY(5px)    rotate(-15deg); }
  35% { opacity:1; transform:scale(1.3) translateY(-90px)  rotate(20deg);  }
  55% { opacity:1; transform:scale(1.2) translateY(-110px) rotate(-10deg); }
  75% { opacity:1; transform:scale(1.1) translateY(-95px)  rotate(5deg);   }
  100%{ opacity:1; transform:scale(1.05) translateY(-100px) rotate(0deg);  }
}
.capsule-body { width:60px; height:80px; border-radius:30px; position:relative; overflow:hidden; box-shadow:0 4px 18px rgba(0,0,0,0.4),inset 0 2px 8px rgba(255,255,255,0.3); border:3px solid rgba(0,0,0,0.2); }
.capsule-top    { position:absolute; top:0; left:0; right:0; height:50%; border-radius:30px 30px 0 0; }
.capsule-bottom { position:absolute; bottom:0; left:0; right:0; height:50%; border-radius:0 0 30px 30px; }
.capsule-line   { position:absolute; top:50%; left:0; right:0; height:3px; background:rgba(0,0,0,0.2); transform:translateY(-50%); }
.capsule-shine  { position:absolute; top:8px; left:9px; width:14px; height:26px; background:rgba(255,255,255,0.4); border-radius:8px; transform:rotate(-18deg); }

.mouth-glow { position:absolute; left:131px; top:248px; width:60px; height:50px; border-radius:50%; background:radial-gradient(circle, rgba(255,120,60,0.9) 0%, transparent 70%); pointer-events:none; opacity:0; }
.mouth-glow.active { animation:mouthGlow 0.8s ease-out forwards; }
@keyframes mouthGlow { 0%{opacity:0;transform:scale(0.5)} 30%{opacity:1;transform:scale(1.5)} 100%{opacity:0;transform:scale(2.5)} }
.sparkle { position:absolute; pointer-events:none; font-size:1.2rem; opacity:0; }
.sparkle.burst { animation:sparkleBurst var(--dur) ease-out forwards; }
@keyframes sparkleBurst { 0%{opacity:1;transform:translate(0,0) scale(0.5)} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.2)} }

/* ===== POINT POPUP (交換) ===== */
#exchange-popup {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  z-index:200; pointer-events:none; opacity:0;
}
#exchange-popup.show { pointer-events:all; animation:popIn 0.3s ease forwards; }
.exchange-card {
  position:relative; z-index:10;
  background: linear-gradient(145deg, #1a0020, #0a0010);
  border-radius:24px; padding:28px 32px 24px;
  max-width:300px; width:88%; text-align:center;
  box-shadow:0 0 40px rgba(255,150,0,0.4), inset 0 0 30px rgba(255,180,0,0.05);
  border:2px solid rgba(255,180,0,0.5);
  animation:cardPop 0.4s cubic-bezier(0.2,1.5,0.5,1) both;
}
.exchange-title { font-size:1.1rem; font-weight:900; color:#ffe566; margin-bottom:14px; }
.exchange-item {
  background: rgba(255,180,0,0.08);
  border: 1.5px solid rgba(255,180,0,0.35);
  border-radius:12px; padding:10px 14px; margin-bottom:10px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.exchange-item .ex-name { font-size:0.85rem; color:#fff; font-weight:700; text-align:left; flex:1; }
.exchange-item .ex-cost { font-size:0.8rem; color:#ffaa44; font-weight:900; white-space:nowrap; }
.exchange-item .ex-btn {
  background: linear-gradient(135deg,#cc6600,#ff3388);
  color:#fff; border:none; border-radius:14px;
  padding:4px 12px; font-size:0.75rem; font-weight:900;
  font-family:'Noto Sans JP',sans-serif; cursor:pointer;
  transition:transform 0.1s;
}
.exchange-item .ex-btn:hover  { transform:scale(1.06); }
.exchange-item .ex-btn:active { transform:scale(0.95); }
.exchange-item .ex-btn:disabled { background:#555; cursor:not-allowed; }
.exchange-close {
  margin-top:6px; background:transparent; color:#aa7788;
  border:1px solid #554455; border-radius:20px;
  padding:7px 24px; font-size:0.85rem; font-weight:700;
  font-family:'Noto Sans JP',sans-serif; cursor:pointer;
  transition:color 0.15s;
}
.exchange-close:hover { color:#fff; }

/* ===== RESULT POPUP ===== */
#result-popup { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:100; pointer-events:none; opacity:0; }
#result-popup.show { pointer-events:all; animation:popIn 0.4s ease forwards; }
@keyframes popIn { to{opacity:1} }
.popup-backdrop { position:absolute; inset:0; background:rgba(10,0,5,0.75); backdrop-filter:blur(6px); }
.popup-card {
  position:relative; z-index:10;
  background:linear-gradient(145deg,#1a0020,#0a0010);
  border-radius:24px; padding:32px 38px 26px; max-width:310px; width:88%; text-align:center;
  box-shadow:0 0 40px rgba(255,150,0,0.4),0 0 80px rgba(255,0,100,0.2),inset 0 0 30px rgba(255,180,0,0.05);
  border:2px solid rgba(255,180,0,0.5);
  animation:cardPop 0.45s cubic-bezier(0.2,1.5,0.5,1) 0.08s both;
}
@keyframes cardPop { 0%{transform:scale(0.35) rotate(-6deg)} 65%{transform:scale(1.07) rotate(2deg)} 100%{transform:scale(1) rotate(0deg)} }
/* popup-rank replaced by fortune-label */
.popup-emoji { font-size:3.4rem; margin-bottom:6px; display:block; animation:emojiPop 0.4s cubic-bezier(0.2,1.5,0.5,1) 0.25s both; }
@keyframes emojiPop { 0%{transform:scale(0)} 100%{transform:scale(1)} }
.popup-title { font-size:1.3rem; font-weight:900; color:#ffe566; margin-bottom:6px; line-height:1.3; text-shadow:0 0 10px rgba(255,200,0,0.5); }
.popup-desc  { font-size:0.8rem; color:#cc99aa; line-height:1.65; margin-bottom:8px; white-space:pre-line; }
.popup-code  { display:block; background:rgba(255,180,0,0.1); border:2px dashed rgba(255,180,0,0.6); border-radius:10px; padding:8px 12px; font-size:1.05rem; font-weight:900; letter-spacing:0.2em; color:#ffe566; margin-bottom:10px; }
.popup-pt-gain { font-size:0.95rem; font-weight:900; color:#44ff88; margin-bottom:14px; text-shadow:0 0 8px rgba(0,255,100,0.6); }
.popup-btn { background:linear-gradient(135deg,#cc6600,#ff3388); color:#fff; border:none; padding:11px 30px; border-radius:50px; font-size:0.95rem; font-weight:700; font-family:'Noto Sans JP',sans-serif; cursor:pointer; letter-spacing:0.1em; box-shadow:0 0 20px rgba(255,100,0,0.5); transition:transform 0.15s,box-shadow 0.15s; }
.base-btn { display:block; background:linear-gradient(135deg,#ff6600,#ff3388); color:#fff; border:none; border-radius:50px; padding:10px 24px; font-size:0.88rem; font-weight:900; font-family:'Noto Sans JP',sans-serif; cursor:pointer; letter-spacing:0.08em; text-decoration:none; text-align:center; box-shadow:0 0 16px rgba(255,80,0,0.5); transition:transform 0.15s; margin-bottom:10px; }
.base-btn:hover { transform:scale(1.04); }
.base-btn:active { transform:scale(0.97); }
.popup-btn:hover  { transform:scale(1.05); box-shadow:0 0 30px rgba(255,100,0,0.8); }
.popup-btn:active { transform:scale(0.97); }
/* ===== OMIKUJI RESULT ===== */
.fortune-label {
  font-size: 2.6rem; font-weight: 900; letter-spacing: 0.3em;
  margin-bottom: 4px; display: block;
}
.fortune-msg {
  font-size: 0.82rem; color: #ffccaa; line-height: 1.65;
  margin-bottom: 10px; white-space: pre-line;
}
.dinner-box {
  background: rgba(255,180,0,0.08);
  border: 1.5px solid rgba(255,180,0,0.3);
  border-radius: 12px; padding: 10px 14px;
  margin-bottom: 10px; text-align: left;
}
.dinner-hdr  { font-size: 0.68rem; color: #ffaa44; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 5px; }
.dinner-name { font-size: 1.05rem; font-weight: 900; color: #ffe566; margin-bottom: 4px; }
.dinner-cmt  { font-size: 0.78rem; color: #cc99aa; line-height: 1.5; }

.popup-code  { display: block; background: rgba(255,180,0,0.1); border: 2px dashed rgba(255,180,0,0.6); border-radius: 10px; padding: 8px 12px; font-size: 1.1rem; font-weight: 900; letter-spacing: 0.2em; color: #ffe566; margin-bottom: 4px; }
.popup-pt-gain { font-size: 0.95rem; font-weight: 900; margin-bottom: 14px; }

/* ===== LIMIT POPUP ===== */
#limit-popup { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:150; pointer-events:none; opacity:0; }
#limit-popup.show { pointer-events:all; animation:popIn 0.3s ease forwards; }
.limit-card { position:relative; z-index:10; background:linear-gradient(145deg,#200010,#0a0008); border-radius:20px; padding:28px 32px; max-width:280px; width:85%; text-align:center; box-shadow:0 0 30px rgba(255,50,50,0.3); border:2px solid rgba(255,80,80,0.4); animation:cardPop 0.4s cubic-bezier(0.2,1.5,0.5,1) both; }
.limit-emoji { font-size:2.8rem; margin-bottom:8px; }
.limit-title { font-size:1.1rem; font-weight:900; color:#ff6666; margin-bottom:8px; }
.limit-desc  { font-size:0.82rem; color:#aa8888; line-height:1.6; margin-bottom:16px; }
.limit-time  { font-size:1.1rem; font-weight:900; color:#ffe566; margin-bottom:16px; }
.limit-btn   { background:#333; color:#aaa; border:1px solid #555; border-radius:20px; padding:8px 24px; font-size:0.9rem; font-family:'Noto Sans JP',sans-serif; cursor:pointer; }

.cp { position:fixed; border-radius:2px; top:-12px; opacity:0; pointer-events:none; z-index:200; animation:cf linear forwards; }
@keyframes cf { 0%{opacity:1;transform:translateY(0) rotate(0deg)} 100%{opacity:0;transform:translateY(110vh) rotate(720deg)} }
@keyframes floatUp { 0%{opacity:0;transform:translateY(0) rotate(0deg)} 10%{opacity:0.7} 90%{opacity:0.4} 100%{opacity:0;transform:translateY(-110vh) rotate(360deg)} }

/* ===== BONUS BAR ===== */
#bonus-bar {
  position: relative; z-index: 10;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
#bonus-input {
  background: rgba(0,0,0,0.4);
  border: 1.5px solid rgba(0,150,255,0.35);
  border-radius: 20px;
  padding: 5px 14px;
  color: #ffe566;
  font-size: 0.78rem;
  font-family: 'Noto Sans JP', sans-serif;
  width: 110px;
  outline: none;
}
#bonus-input::placeholder { color: #556677; }
#bonus-input:focus { border-color: rgba(0,180,255,0.7); }
#bonus-btn {
  background: linear-gradient(135deg, #004499, #0077ff);
  color: #fff; border: none; border-radius: 20px;
  padding: 5px 13px; font-size: 0.72rem; font-weight: 900;
  font-family: 'Noto Sans JP', sans-serif; cursor: pointer;
  box-shadow: 0 0 8px rgba(0,100,255,0.4);
  transition: transform 0.1s;
}
#bonus-btn:hover  { transform: scale(1.06); }
#bonus-btn:active { transform: scale(0.95); }
#bonus-msg { font-size: 0.7rem; font-weight: 700; min-width: 0; }

/* ===== スマホ最適化 ===== */
@media screen and (max-width: 768px) {
  body {
    justify-content: flex-start;
    padding-top: 28px;
  }
}
/* iPhone標準（〜780px: iPhone SE〜14クラス） */
@media screen and (max-height: 780px) {
  body { padding-top: 26px; }
  h1 { font-size: 1.75rem; margin-bottom: 2px; }
  .subtitle { font-size: 0.8rem; margin-bottom: 6px; }
  #point-bar { padding: 5px 14px; margin-bottom: 6px; }
  #remaining-bar { margin-bottom: 3px; }
  #bonus-bar { margin-bottom: 6px; }
  .face-wrapper {
    width: 280px; height: 280px;
    transform: scale(0.875);
    transform-origin: top center;
    margin-bottom: -40px;
  }
  .face-img { width: 280px; height: 280px; }
  .eye-hitarea { width: 96px; height: 76px; top: 121px; left: 165px; }
  .eye-spin    { width: 82px; height: 62px; top: 128px; left: 172px; }
  .eye-spin img { width: 82px; height: 62px; }
  .hint { top: 191px; left: 198px; font-size: 1.15rem; }
  #capsule-container { left: 115px; top: 226px; }
  .mouth-glow { left: 115px; top: 217px; }
}
/* 小さめスマホ（〜680px: iPhone SE等） */
@media screen and (max-height: 680px) {
  body { padding-top: 24px; }
  h1 { font-size: 1.5rem; margin-bottom: 1px; }
  .subtitle { font-size: 0.74rem; margin-bottom: 4px; }
  #point-bar { padding: 4px 12px; margin-bottom: 4px; }
  #point-display { font-size: 1.1rem; }
  #remaining-bar { margin-bottom: 2px; font-size: 0.7rem; }
  #bonus-bar { margin-bottom: 4px; }
  .face-wrapper {
    width: 250px; height: 250px;
    transform: scale(0.78);
    transform-origin: top center;
    margin-bottom: -70px;
  }
  .face-img { width: 250px; height: 250px; }
  .eye-hitarea { width: 86px; height: 68px; top: 108px; left: 148px; }
  .eye-spin    { width: 74px; height: 55px; top: 114px; left: 153px; }
  .eye-spin img { width: 74px; height: 55px; }
  .hint { top: 171px; left: 177px; font-size: 1.05rem; }
  #capsule-container { left: 103px; top: 202px; }
  .mouth-glow { left: 103px; top: 195px; }
}
</style>
</head>
<body>

<div class="bg-layer bg-base"></div>
<div class="bg-layer bg-lines"></div>
<div class="bg-layer bg-neon"></div>
<div class="bg-layer bg-dots"></div>
<div class="marquee-strip top"    id="marquee-top"></div>
<div class="marquee-strip bottom" id="marquee-bottom"></div>

<h1>🎰 おまんぼガチャ</h1>
<p class="subtitle">左目をタップしてガチャを回そう</p>
<p class="subtitle" style="font-size:0.72rem;color:#cc88aa;margin-top:-10px;">1日1回まわせます ✦ 合言葉で+1回</p>

<!-- ポイント表示バー -->
<div id="point-bar">
  <span class="pt-label">MY PT</span>
  <span id="point-display">0</span>
  <span class="pt-unit">pt</span>
  <button id="exchange-btn">ポイント確認 ⭐</button>
</div>

<!-- 残り回数 -->
<div id="remaining-bar">今日あと <span id="remaining-count">1</span> 回まわせます</div>

<!-- 合言葉ボーナス -->
<div id="bonus-bar">
  <input id="bonus-input" type="text" placeholder="合言葉を入力" maxlength="20">
  <button id="bonus-btn">+1ボーナス</button>
  <span id="bonus-msg"></span>

function getTodayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function getEffectiveLimit() {
  return DAILY_LIMIT + (_mem.bonusUsed ? 1 : 0);
}
function saveState() {
  var today = getTodayStr();
  if (!_mem.usedDate) _mem.usedDate = today;
  try {
    localStorage.setItem('omanbosan_gacha', JSON.stringify({
      points:    _mem.points,
      usedDate:  _mem.usedDate,
      usedToday: _mem.usedToday,
      bonusUsed: _mem.bonusUsed
    }));
  } catch(e) {}
}
function loadState() {
  try {
    var raw = localStorage.getItem('omanbosan_gacha');
    if (!raw) return;
    var d = JSON.parse(raw);
    if (d.points   >= 0) _mem.points    = d.points;
    if (d.usedDate)      _mem.usedDate   = d.usedDate;
    if (d.usedToday >= 0) _mem.usedToday = d.usedToday;
    _mem.bonusUsed = d.bonusUsed || false;
    var today = getTodayStr();
    if (_mem.usedDate && _mem.usedDate !== today) {
      _mem.usedToday = 0; _mem.usedDate = today; _mem.bonusUsed = false;
    }
  } catch(e) {}
}

// ===== ポイント管理 =====
function getUsedCount() {
  var today = getTodayStr();
  if (_mem.usedDate !== today) {
    _mem.usedToday = 0; _mem.usedDate = today; _mem.bonusUsed = false; saveState();
  }
  return _mem.usedToday;
}
function incrementUsed()  { getUsedCount(); _mem.usedToday++; saveState(); }
function getPoints()      { return _mem.points; }
function addPoints(pt)    { _mem.points += pt; updatePointDisplay(); saveState(); }
function spendPoints(pt)  {
  if (_mem.points < pt) return false;
  _mem.points -= pt; updatePointDisplay(); saveState(); return true;
}
function updatePointDisplay() {
  document.getElementById('point-display').textContent = _mem.points;
}
function updateRemainingDisplay() {
  var rem = Math.max(0, getEffectiveLimit() - getUsedCount());
  document.getElementById('remaining-count').textContent = rem;
  if (rem === 0) {
    document.getElementById('remaining-bar').style.color = '#ff6666';
    document.getElementById('hint').classList.add('hidden');
  } else {
    document.getElementById('remaining-bar').style.color = '';
  }
  var bb = document.getElementById('bonus-bar');
  if (bb && _mem.bonusUsed) bb.style.display = 'none';
}

// ===== 合言葉ボーナス =====
function doBonus() {
  var input = document.getElementById('bonus-input');
  var msg   = document.getElementById('bonus-msg');
  getUsedCount();
  if (_mem.bonusUsed) {
    msg.textContent = '本日分は使用済みです';
    msg.style.color = '#ff6666'; return;
  }
  if (input.value === BONUS_WORD) {
    _mem.bonusUsed = true; saveState(); input.value = '';
    msg.textContent = 'ボーナス！+1回ゲット！';
    msg.style.color = '#44ff88';
    updateRemainingDisplay();
    setTimeout(function() {
      var bar = document.getElementById('bonus-bar');
      if (bar) bar.style.display = 'none';
    }, 2000);
  } else {
    msg.textContent = '合言葉が違います';
    msg.style.color = '#ff6666';
  }
}



// ===== おみくじ抽選 =====
function pickFortune() {
  var total = 0;
  for (var i = 0; i < fortunes.length; i++) total += fortunes[i].weight;
  var r = Math.random() * total;
  for (var j = 0; j < fortunes.length; j++) { r -= fortunes[j].weight; if (r <= 0) return fortunes[j]; }
  return fortunes[fortunes.length-1];
}

function timeUntilMidnight() {
  var now = new Date();
  var midnight = new Date(now); midnight.setHours(24,0,0,0);
  var ms = midnight - now;
  var h = Math.floor(ms/3600000);
  var m = Math.floor((ms%3600000)/60000);
  return h + '時間' + m + '分後にリセット';
}

var busy = false;

function doGacha() {
  if (busy) return;
  if (getUsedCount() >= getEffectiveLimit()) {
    document.getElementById('limit-time').textContent = timeUntilMidnight();
    document.getElementById('limit-popup').classList.add('show');
    return;
  }
  busy = true;
  incrementUsed();
  updateRemainingDisplay();
  document.getElementById('hint').classList.add('hidden');
  var fortune = pickFortune();
  document.getElementById('eye-spin').classList.add('spinning');
  setTimeout(function() {
    document.getElementById('capsule-top').style.background    = fortune.color;
    document.getElementById('capsule-bottom').style.background = fortune.color;
    document.getElementById('capsule').classList.add('launch');
    var glow = document.getElementById('mouth-glow');
    glow.classList.add('active');
    spawnSparkles(161, 268);
    setTimeout(function() { glow.classList.remove('active'); }, 900);
    setTimeout(function() { showResult(fortune); }, 2800);
  }, 1100);
}

function showResult(fortune) {
  addPoints(fortune.pt);
  var dList = dinnerMenus[fortune.key];
  var dItem = dList[Math.floor(Math.random() * dList.length)];
  var msgs  = fortuneMsgs[fortune.key];
  var fmsg  = msgs[Math.floor(Math.random() * msgs.length)];

  var lbl = document.getElementById('fortune-label');
  lbl.textContent  = fortune.label;
  lbl.style.color  = fortune.color;
  lbl.style.textShadow = '0 0 24px ' + fortune.color + ', 0 0 48px ' + fortune.color;
  document.getElementById('popup-emoji').textContent  = fortune.emoji;
  document.getElementById('fortune-msg').textContent  = fmsg;
  document.getElementById('dinner-name').textContent  = dItem[0];
  document.getElementById('dinner-cmt').textContent   = dItem[1];

  var ptEl = document.getElementById('popup-pt-gain');
  if (fortune.pt > 0) {
    ptEl.textContent = '+' + fortune.pt + ' pt ゲット！';
    ptEl.style.color = '#44ff88';
  } else {
    ptEl.textContent = 'また明日！🌙';
    ptEl.style.color = '#888888';
  }
  document.getElementById('result-popup').classList.add('show');
  spawnConfetti(fortune.key === 'daigichi' || fortune.key === 'kichi');
}

function resetAll() {
  document.getElementById('result-popup').classList.remove('show');
  var spin = document.getElementById('eye-spin');
  var cap  = document.getElementById('capsule');
  spin.classList.remove('spinning');
  cap.classList.remove('launch');
  document.getElementById('mouth-glow').classList.remove('active');
  var x = spin.offsetWidth; x = cap.offsetWidth;
  if (getUsedCount() < getEffectiveLimit()) {
    document.getElementById('hint').classList.remove('hidden');
  }
  setTimeout(function() { busy = false; }, 50);
}

// ===== 景品交換 =====
function buildExchangeList() {
  var list = document.getElementById('exchange-list');
  var pt   = getPoints();
  list.innerHTML =
    '<div style="text-align:center;padding:18px 0;">' +
    '<div style="font-size:2rem;margin-bottom:8px;">✨</div>' +
    '<div style="font-size:0.9rem;color:#ffe566;font-weight:900;margin-bottom:8px;">' +
    '現在のポイント：' + pt + ' pt</div>' +
    '<div style="font-size:0.78rem;color:#cc99aa;line-height:1.7;">' +
    '景品は目下準備中です♪<br>' +
    'ポイントはそのまま貯めておいてね！</div>' +
    '</div>';
}

// ===== エフェクト =====
function spawnSparkles(cx, cy) {
  var wrapper = document.getElementById('face-wrapper');
  var emojis  = ['✨','💥','⭐','🌟','💫'];
  for (var i = 0; i < 8; i++) {
    (function(idx) {
      var el = document.createElement('div');
      el.className = 'sparkle burst';
      var angle = (idx/8) * Math.PI * 2;
      var dist  = 40 + Math.random()*35;
      el.style.left = cx + 'px'; el.style.top = cy + 'px';
      el.style.setProperty('--tx', (Math.cos(angle)*dist).toFixed(1)+'px');
      el.style.setProperty('--ty', (Math.sin(angle)*dist).toFixed(1)+'px');
      el.style.setProperty('--dur', (0.5+Math.random()*0.4).toFixed(2)+'s');
      el.textContent = emojis[Math.floor(Math.random()*5)];
      wrapper.appendChild(el);
      setTimeout(function() { el.parentNode && el.parentNode.removeChild(el); }, 1200);
    })(i);
  }
}
function spawnConfetti(fancy) {
  var n    = fancy ? 65 : 18;
  var cols = fancy ? ['#f0a020','#e05080','#3a8fd8','#44cc88','#ff6644','#cc55ee'] : ['#aaa','#ccc'];
  for (var i = 0; i < n; i++) {
    (function(delay) {
      setTimeout(function() {
        var el = document.createElement('div');
        el.className = 'cp';
        el.style.left   = (Math.random()*100)+'vw';
        el.style.width  = (6+Math.random()*10)+'px';
        el.style.height = el.style.width;
        el.style.background   = cols[Math.floor(Math.random()*cols.length)];
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        el.style.animationDuration = (1.6+Math.random()*2)+'s';
        document.body.appendChild(el);
        setTimeout(function() { el.parentNode && el.parentNode.removeChild(el); }, 4500);
      }, delay);
    })(i * 28);
  }
}

// ===== マーキーライト =====
(function() {
  var colors = ['#ffe566','#ff4488','#00ddff','#ff8800','#cc44ff','#44ff88','#ffffff'];
  function buildStrip(el) {
    var n = Math.floor(window.innerWidth / 20);
    for (var i = 0; i < n; i++) {
      var b = document.createElement('div');
      b.className = 'bulb';
      var c = colors[i % colors.length];
      b.style.background = c; b.style.boxShadow = '0 0 6px 2px '+c;
      b.style.animation  = 'bulbBlink 1s '+(i*0.07).toFixed(2)+'s ease-in-out infinite alternate';
      el.appendChild(b);
    }
  }
  var t = document.getElementById('marquee-top');
  var bb = document.getElementById('marquee-bottom');
  if (t)  buildStrip(t);
  if (bb) buildStrip(bb);
})();

// ===== 浮遊絵文字 =====
(function() {
  var floatEmojis = ['🎰','✨','🎊','🌟','💫','🎁','🎉','⭐','🎆','💥'];
  function spawn() {
    var el = document.createElement('div');
    el.textContent = floatEmojis[Math.floor(Math.random()*floatEmojis.length)];
    el.style.position = 'fixed'; el.style.left = (Math.random()*100)+'vw';
    el.style.bottom = '-60px'; el.style.fontSize = (1.2+Math.random()*1.6).toFixed(2)+'rem';
    el.style.opacity = '0'; el.style.pointerEvents = 'none'; el.style.zIndex = '5';
    el.style.animation = 'floatUp '+(5+Math.random()*5).toFixed(2)+'s ease-out forwards';
    document.body.appendChild(el);
    setTimeout(function() { el.parentNode && el.parentNode.removeChild(el); }, 12000);
  }
  setInterval(spawn, 1200); spawn(); spawn(); spawn();
})();

// ===== イベントリスナー =====
document.getElementById('eye-hitarea').addEventListener('click', doGacha);
document.getElementById('popup-close').addEventListener('click', resetAll);
document.getElementById('popup-backdrop').addEventListener('click', resetAll);
document.getElementById('limit-close').addEventListener('click', function() {
  document.getElementById('limit-popup').classList.remove('show');
});
document.getElementById('exchange-btn').addEventListener('click', function() {
  document.getElementById('exchange-msg').style.display = 'none';
  buildExchangeList();
  document.getElementById('exchange-popup').classList.add('show');
});
document.getElementById('exchange-close').addEventListener('click', function() {
  document.getElementById('exchange-popup').classList.remove('show');
});
document.getElementById('ex-backdrop').addEventListener('click', function() {
  document.getElementById('exchange-popup').classList.remove('show');
});
document.getElementById('bonus-btn').addEventListener('click', doBonus);
document.getElementById('bonus-input').addEventListener('keydown', function(e) {
  if (e.keyCode === 13) doBonus();
});

// ===== 初期化 =====
loadState();
updatePointDisplay();
updateRemainingDisplay();
</script>
