<!doctype html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おまんぼガチャ 管理</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height: 100vh; min-height: 100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: 'Noto Sans JP', sans-serif; background:#0a0008; color:#eee; padding:20px;
  }
  .card {
    width:100%; max-width:360px; background:rgba(255,255,255,0.05);
    border:1.5px solid rgba(255,180,0,0.4); border-radius:16px; padding:24px;
  }
  h1 { font-size:1.1rem; color:#ffe566; margin-bottom:4px; text-align:center; }
  .sub { font-size:0.72rem; color:#cc99ff; text-align:center; margin-bottom:14px; }
  label { display:block; font-size:0.75rem; color:#ffaa44; margin-bottom:4px; }
  input {
    width:100%; padding:10px 12px; margin-bottom:12px; border-radius:8px;
    border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.4); color:#fff; font-size:1rem;
  }
  input::placeholder { color:#777; }
  button {
    width:100%; padding:11px; border:none; border-radius:20px; font-weight:900; font-size:0.9rem;
    background:linear-gradient(135deg,#cc6600,#ff3388); color:#fff; cursor:pointer;
  }
  button:disabled { opacity:0.5; cursor:default; }
  .msg { margin-top:12px; font-size:0.8rem; text-align:center; line-height:1.5; }
  .msg.error { color:#ff6666; }
  .result {
    margin-top:16px; padding:14px; border-radius:12px; background:rgba(0,0,0,0.35);
    border:1px solid rgba(255,220,0,0.3); display:none;
  }
  .result .pt { font-size:2rem; font-weight:900; color:#ffe566; text-align:center; }
  .result .code { font-size:0.75rem; color:#cc99ff; text-align:center; margin-top:4px; letter-spacing:0.1em; }
  .result .updated { font-size:0.68rem; color:#999; text-align:center; margin-top:6px; }
  .stats { display:flex; gap:8px; margin-bottom:14px; }
  .stat-box {
    flex:1; background:rgba(0,0,0,0.35); border:1px solid rgba(255,220,0,0.25);
    border-radius:10px; padding:10px 4px; text-align:center;
  }
  .stat-box .num { font-size:1.25rem; font-weight:900; color:#ffe566; }
  .stat-box .label { font-size:0.6rem; color:#cc99ff; margin-top:2px; }
  .refresh { font-size:0.68rem; color:#999; text-align:right; margin-bottom:10px; cursor:pointer; text-decoration:underline; }
  #redeem-box { margin-top:16px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.15); }
  .redeem-label { font-size:0.72rem; color:#ffaa44; margin-bottom:8px; text-align:center; }
  .redeem-quick { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; justify-content:center; }
  .redeem-quick button {
    width:auto; flex:0 0 auto; padding:7px 12px; font-size:0.78rem;
    background:rgba(255,220,0,0.12); border:1px solid rgba(255,220,0,0.4); color:#ffe566;
  }
  .redeem-quick button:disabled { opacity:0.3; }
  .redeem-custom { display:flex; gap:6px; }
  .redeem-custom input { margin-bottom:0; flex:1; }
  .redeem-custom button { width:auto; flex:0 0 auto; padding:10px 16px; font-size:0.8rem; }
  .qr-scan-btn { background:linear-gradient(135deg,#0099cc,#00ddaa); margin-bottom:12px; }
  #qr-scan-box { margin-bottom:14px; }
  #qr-scan-box video { width:100%; border-radius:10px; background:#000; display:block; }
  .qr-scan-hint { font-size:0.7rem; color:#999; text-align:center; margin:6px 0; }
  .qr-scan-cancel { width:100%; padding:8px; font-size:0.78rem; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25); color:#ccc; border-radius:20px; }
  .logout-link { font-size:0.65rem; color:#888; text-align:center; margin-top:14px; text-decoration:underline; cursor:pointer; }
</style>
</head>
<body>

<div class="card">
  <h1>🎁 おまんぼガチャ 管理</h1>
  <div class="sub">スタッフ用パスワードを入力してください</div>

  <div id="login-box">
    <label for="admin-password">パスワード</label>
    <input id="admin-password" type="password" placeholder="パスワード" autocomplete="current-password">
    <button id="login-btn">ログイン</button>
    <div id="login-msg" class="msg"></div>
  </div>

  <div id="main-box" style="display:none;">
    <div class="stats">
      <div class="stat-box"><div class="num" id="stat-count">-</div><div class="label">プレイ人数</div></div>
      <div class="stat-box"><div class="num" id="stat-total">-</div><div class="label">合計pt</div></div>
      <div class="stat-box"><div class="num" id="stat-today">-</div><div class="label">本日プレイ</div></div>
    </div>
    <div class="refresh" id="stats-refresh">🔄 更新</div>
    <div class="logout-link" id="logout-link">🔓 ログアウト（別のパスワードで入り直す）</div>

    <label for="code">お客様のコード（6桁）</label>
    <button type="button" id="qr-scan-btn" class="qr-scan-btn">📷 QRを読み取ってすぐ検索</button>
    <div id="qr-scan-box" style="display:none;">
      <video id="qr-video" playsinline muted></video>
      <div class="qr-scan-hint" id="qr-scan-hint">QRコードを枠内に写してください</div>
      <button type="button" id="qr-scan-cancel" class="qr-scan-cancel">キャンセル</button>
    </div>
    <input id="code" type="text" placeholder="例: A3F7Q2" maxlength="6" style="text-transform:uppercase;letter-spacing:0.15em;">
    <button id="search-btn">検索</button>
    <div id="search-msg" class="msg"></div>

    <div id="result" class="result">
      <div class="pt"><span id="result-pt">0</span> pt</div>
      <div class="code">コード: <span id="result-code"></span></div>
      <div class="updated">最終更新: <span id="result-updated"></span></div>

      <div id="redeem-box">
        <div class="redeem-label">クーポン利用（1pt = 1円、100pt単位）</div>
        <div class="redeem-quick" id="redeem-quick"></div>
        <div class="redeem-custom">
          <input id="redeem-amount" type="number" step="100" min="100" placeholder="金額（100の倍数）">
          <button id="redeem-btn">利用する</button>
        </div>
        <div id="redeem-msg" class="msg"></div>
      </div>
    </div>
  </div>
</div>

<script src="jsqr.min.js" defer></script>
<script>
// 2026-08-13: 管理画面をGitHub Pagesの静的ページへ全面移転した。
// 旧・GAS HtmlService版はページ本体を独自のsandbox iframe(別オリジン)で包んで配信しており、
// そのiframeがcamera権限を委譲しないためQRスキャンが原理的に常に失敗していた。
// このページはGitHub Pagesの純粋な静的HTMLなのでその制約を受けず、カメラが正常に動作する。
// GAS側は認証・データ処理だけを担う純粋なJSON APIとして呼び出す(google.script.runは使わない)。
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxaxqS3HNkWJZNkDLAPkqNpdn372RAP2pzYWVUUbGwCb4V1HxGDb4bBa87VxHdjCpwX/exec';

function apiCall(action, payload) {
  var url = GAS_URL + '?action=' + action + '&d=' + encodeURIComponent(JSON.stringify(payload));
  return fetch(url).then(function(r) { return r.json(); });
}

// ===== パスワード認証（全スタッフ共通の1つのパスワード） =====
var PW_STORAGE_KEY = 'omanbosan_gacha_admin_pw';
function getStoredPassword() {
  try { return localStorage.getItem(PW_STORAGE_KEY) || ''; } catch (e) { return ''; }
}
function storePassword(pw) {
  try { localStorage.setItem(PW_STORAGE_KEY, pw); } catch (e) {}
}
function clearStoredPassword() {
  try { localStorage.removeItem(PW_STORAGE_KEY); } catch (e) {}
}

// パスワードが正しければmain-boxを表示、間違っていればlogin-boxにエラーを出す。
function loadStats(password) {
  ['stat-count','stat-total','stat-today'].forEach(function(id) {
    document.getElementById(id).textContent = '…';
  });
  apiCall('gachaAdminStats', { password: password })
    .then(function(res) {
      if (res && res.ok) {
        storePassword(password);
        document.getElementById('main-box').style.display = 'block';
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('stat-count').textContent = res.data.count;
        document.getElementById('stat-total').textContent = res.data.totalPoints;
        document.getElementById('stat-today').textContent = res.data.todayActive;
      } else {
        clearStoredPassword();
        document.getElementById('main-box').style.display = 'none';
        document.getElementById('login-box').style.display = 'block';
        document.getElementById('login-msg').className = 'msg error';
        document.getElementById('login-msg').textContent = (res && res.error) || 'パスワードが違います';
      }
    })
    .catch(function() {
      document.getElementById('login-msg').className = 'msg error';
      document.getElementById('login-msg').textContent = '通信エラーが発生しました';
    });
}

document.getElementById('stats-refresh').addEventListener('click', function() { loadStats(getStoredPassword()); });

document.getElementById('login-btn').addEventListener('click', function() {
  var pw = document.getElementById('admin-password').value;
  if (!pw) { document.getElementById('login-msg').className = 'msg error'; document.getElementById('login-msg').textContent = 'パスワードを入力してください'; return; }
  document.getElementById('login-msg').className = 'msg'; document.getElementById('login-msg').textContent = 'ログイン中...';
  loadStats(pw);
});
document.getElementById('admin-password').addEventListener('keydown', function(e) {
  if (e.keyCode === 13) document.getElementById('login-btn').click();
});
document.getElementById('logout-link').addEventListener('click', function() {
  clearStoredPassword();
  document.getElementById('admin-password').value = '';
  document.getElementById('main-box').style.display = 'none';
  document.getElementById('login-box').style.display = 'block';
  document.getElementById('login-msg').className = 'msg';
  document.getElementById('login-msg').textContent = '';
});

var currentCode = null; // 検索中/交換対象のコード

document.getElementById('search-btn').addEventListener('click', function() {
  var code = document.getElementById('code').value.trim().toUpperCase();
  var resultEl = document.getElementById('result');
  var msgEl = document.getElementById('search-msg');
  resultEl.style.display = 'none';
  if (!code) { msgEl.className = 'msg error'; msgEl.textContent = 'コードを入力してください'; return; }
  var btn = this;
  btn.disabled = true;
  msgEl.className = 'msg'; msgEl.textContent = '検索中...';
  apiCall('gachaAdminLookup', { code: code, password: getStoredPassword() })
    .then(function(res) {
      btn.disabled = false;
      if (res && res.ok) {
        msgEl.textContent = '';
        currentCode = res.data.code;
        document.getElementById('result-pt').textContent = res.data.points;
        document.getElementById('result-code').textContent = res.data.code;
        document.getElementById('result-updated').textContent = res.data.updatedAt ? new Date(res.data.updatedAt).toLocaleString('ja-JP') : '-';
        renderRedeemQuickButtons(res.data.points);
        resultEl.style.display = 'block';
      } else {
        msgEl.className = 'msg error';
        msgEl.textContent = (res && res.error) || '見つかりませんでした';
      }
    })
    .catch(function() {
      btn.disabled = false;
      msgEl.className = 'msg error';
      msgEl.textContent = '通信エラーが発生しました';
    });
});

document.getElementById('code').addEventListener('keydown', function(e) {
  if (e.keyCode === 13) document.getElementById('search-btn').click();
});

// ===== QRコードスキャン（カメラでコードを読み取り自動入力→自動検索） =====
// このページはGASのsandbox iframeに包まれない純粋な静的ページなので、getUserMedia()が
// Safariの通常の権限フロー通りに動作する(GAS版admin.htmlで失敗していたのはGoogle側の制約)。
var qrStream = null;
var qrRAFHandle = null;
var qrScanCanvas = document.createElement('canvas');
var qrScanCtx = qrScanCanvas.getContext('2d', { willReadFrequently: true });

function setQrHint(text, isError) {
  var el = document.getElementById('qr-scan-hint');
  el.textContent = text;
  el.style.color = isError ? '#ff6666' : '#999';
}

function startQrScan() {
  document.getElementById('qr-scan-box').style.display = 'block';
  setQrHint('QRコードを枠内に写してください', false);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setQrHint('このブラウザはカメラ読み取りに対応していません。手入力してください', true);
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(function(stream) {
      qrStream = stream;
      var video = document.getElementById('qr-video');
      video.srcObject = stream;
      video.play();
      qrRAFHandle = requestAnimationFrame(scanQrFrame);
    })
    .catch(function(e) {
      var name = e && e.name;
      if (name === 'NotAllowedError' || name === 'SecurityError' || name === 'PermissionDeniedError') {
        setQrHint('カメラが拒否されています。iPhoneの「設定」→「Safari」→「カメラ」を確認するか、'
          + 'このページのURL左のアイコンをタップして「Webサイトの設定」からカメラを「許可」に変更してください', true);
      } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
        setQrHint('カメラが見つかりませんでした', true);
      } else if (name === 'NotReadableError' || name === 'TrackStartError') {
        setQrHint('カメラを他のアプリが使用中のようです。他のアプリを閉じてからもう一度お試しください', true);
      } else {
        setQrHint('カメラを起動できませんでした（' + (name || (e && e.message) || '不明なエラー') + '）。手入力もご利用いただけます', true);
      }
    });
}

function stopQrScan() {
  if (qrRAFHandle) { cancelAnimationFrame(qrRAFHandle); qrRAFHandle = null; }
  if (qrStream) { qrStream.getTracks().forEach(function(t) { t.stop(); }); qrStream = null; }
  document.getElementById('qr-scan-box').style.display = 'none';
}

function scanQrFrame() {
  var video = document.getElementById('qr-video');
  if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
    qrScanCanvas.width = video.videoWidth;
    qrScanCanvas.height = video.videoHeight;
    qrScanCtx.drawImage(video, 0, 0, qrScanCanvas.width, qrScanCanvas.height);
    var imageData = qrScanCtx.getImageData(0, 0, qrScanCanvas.width, qrScanCanvas.height);
    var result = jsQR(imageData.data, imageData.width, imageData.height);
    if (result && result.data) {
      var m = /^OMANBO:([A-Z0-9]{6})$/.exec(result.data.trim().toUpperCase());
      if (m) {
        stopQrScan();
        document.getElementById('code').value = m[1];
        document.getElementById('search-btn').click();
        return;
      }
    }
  }
  qrRAFHandle = requestAnimationFrame(scanQrFrame);
}

document.getElementById('qr-scan-btn').addEventListener('click', startQrScan);
document.getElementById('qr-scan-cancel').addEventListener('click', stopQrScan);

// ===== クーポン利用（ポイント消費） =====
var REDEEM_QUICK_AMOUNTS = [100, 200, 300, 500];

function renderRedeemQuickButtons(points) {
  var wrap = document.getElementById('redeem-quick');
  wrap.innerHTML = '';
  REDEEM_QUICK_AMOUNTS.forEach(function(amt) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = amt + '円分';
    b.disabled = points < amt;
    b.addEventListener('click', function() { doRedeem(amt); });
    wrap.appendChild(b);
  });
}

function doRedeem(amount) {
  var msgEl = document.getElementById('redeem-msg');
  if (!currentCode) return;
  amount = Number(amount);
  if (!amount || amount <= 0 || amount % 100 !== 0) {
    msgEl.className = 'msg error'; msgEl.textContent = '100の倍数で指定してください';
    return;
  }
  if (!confirm(currentCode + ' さんのポイントから ' + amount + '円分（' + amount + 'pt）を利用します。よろしいですか？')) return;

  msgEl.className = 'msg'; msgEl.textContent = '処理中...';
  apiCall('gachaAdminRedeem', { code: currentCode, amount: amount, password: getStoredPassword() })
    .then(function(res) {
      if (res && res.ok) {
        msgEl.className = 'msg';
        msgEl.textContent = amount + '円分を利用しました（残り ' + res.data.points + 'pt）';
        document.getElementById('result-pt').textContent = res.data.points;
        renderRedeemQuickButtons(res.data.points);
        loadStats(getStoredPassword());
      } else {
        msgEl.className = 'msg error';
        msgEl.textContent = (res && res.error) || '利用に失敗しました';
      }
    })
    .catch(function() {
      msgEl.className = 'msg error';
      msgEl.textContent = '通信エラーが発生しました';
    });
}

document.getElementById('redeem-btn').addEventListener('click', function() {
  var v = document.getElementById('redeem-amount').value;
  doRedeem(v);
});

// ===== 初期化 =====
// 前回ログインに成功したパスワードがlocalStorageに残っていれば自動ログインを試みる。
// 2026-08-14修正: 以前はここでloadStats()の応答を待つ間、login-boxがデフォルトで
// 表示されたままだったため、GAS側のAPI応答が遅い(Apps Scriptは数秒かかることがある)と
// パスワード入力欄が一瞬〜数秒見えてしまい、「毎回ログイン画面が出る」ように感じられていた。
// 保存済みパスワードがある場合は先にmain-box(読み込み中の「…」表示)へ楽観的に切り替えてから
// バックグラウンドで検証し、実際に無効だった場合だけloadStatsの失敗処理でlogin-boxに戻す。
(function initAdminLogin() {
  var stored = getStoredPassword();
  if (stored) {
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('main-box').style.display = 'block';
    loadStats(stored);
  } else {
    document.getElementById('login-box').style.display = 'block';
    document.getElementById('main-box').style.display = 'none';
  }
})();
</script>

</body>
</html>
